services:
  - type: web
    name: skillpath-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false # You will set this in the Render Dashboard
      - key: MONGODB_URI
        sync: false # You will set this in the Render Dashboard
      - key: DATABASE_NAME
        value: skillpath_ai
